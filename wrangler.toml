name = "rainbowboat-mbti"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"

# Cloudflare D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "rainbowboat_db"
database_id = "07d6a2a1-1e66-494c-998f-c053d8cca68e"

# 环境变量 (机密密钥通过 wrangler secret put 注入，或在 Cloudflare Pages 后台配置)
[vars]
DEFAULT_REGION_MODE = "auto"
